# Diagnostic only, never scheduled. Answers the questions that cannot be
# measured anywhere but on a runner, through the residential proxy the scrape
# actually uses:
#
#   sources  (default) - what is LEFT to scrape. Which registries still yield
#                        candidates, which instances answer, which now serve an
#                        X Corp cease-and-desist notice, and whether X's own
#                        syndication endpoint is reachable from this egress.
#                        Run this before changing the instance strategy.
#   direct / proxied /
#   *-geoip / *-hum    - can a runner CLEAR a Cloudflare challenge, and with
#                        which launch flags. This is what established that
#                        proxy+geoip is the only combination that works.
#
# A datacenter 429 and a residential 429 mean different things, and only this
# workflow can tell them apart - which is why guessing from a dev container is
# not a substitute for dispatching it.
name: Nitter egress probe

on:
  workflow_dispatch:
    inputs:
      arms:
        description: 'Space-separated: sources, direct, direct-geoip, proxied, proxied-geoip, proxied-geoip-hum'
        required: false
        default: 'sources'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache camoufox browser
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: backend/camoufox_build
          key: camoufox-cg-v152.0.4-beta.31-cg.3-v1

      - name: Download camoufox browser
        if: steps.cache-camoufox.outputs.cache-hit != 'true'
        run: |
          cd backend
          curl -fL -o camoufox.zip "https://github.com/coffeegrind123/camoufox-beta/releases/download/v152.0.4-beta.31-cg.3/camoufox-152.0.4-beta.31-lin.x86_64.zip"
          unzip -q camoufox.zip -d camoufox_build
          rm camoufox.zip
          chmod +x camoufox_build/camoufox-bin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64 libdbus-glib-1-2 libxt6

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # The launcher's fingerprint generator (fpgen) downloads its model on first
      # import, through the unauthenticated GitHub API (a rate limit runner IPs
      # share), with TLS verification disabled, taking whichever release the API
      # lists first. Put a pinned, checksummed model where it looks instead,
      # located without importing fpgen (importing triggers the fetch).
      - name: Pin fingerprint model
        run: |
          curl -fL -o /tmp/fpgen-model.zip "https://github.com/scrapfly/fingerprint-generator/releases/download/model-4/2025/model-release.zip"
          echo "5059ccbcd364020f4325c18de0352d78e63852ff5e6fdd6a8eddaa04b55c61d1  /tmp/fpgen-model.zip" | sha256sum -c -
          python -c "import importlib.util, os, zipfile; d = os.path.join(os.path.dirname(importlib.util.find_spec('fpgen').origin), 'data'); zipfile.ZipFile('/tmp/fpgen-model.zip').extractall(d); print('fpgen model ->', d)"
          python -c "from fpgen import Generator; Generator()" 2>&1 | tee /tmp/fpgen-check.log
          ! grep -q "Fetching model files" /tmp/fpgen-check.log

      - name: Register camoufox build
        run: python backend/setup_camoufox.py

      - name: Mask proxy components
        if: env.UPSTREAM_PROXY != ''
        run: |
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*@\(.*\):.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*:\([0-9]*\)$|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://\(.*\):.*@.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://.*:\(.*\)@.*|\1|p')"
        env:
          UPSTREAM_PROXY: ${{ secrets.UPSTREAM_PROXY }}

      # ARMS goes through the environment rather than being interpolated into
      # the run: line. A ${{ inputs.* }} expansion is textual substitution into
      # the shell script, so a dispatch value containing shell metacharacters
      # executes on the runner - with the proxy secret in scope. Only
      # collaborators can dispatch this, which makes it low severity, not a
      # non-issue.
      - name: Probe
        working-directory: backend/src
        run: python egress_probe.py $ARMS
        env:
          ARMS: ${{ inputs.arms }}
          SCRAPER_HTTP_PROXY: ${{ secrets.UPSTREAM_PROXY }}
