name: Scrape Tennis News

on:
  schedule:
    - cron: '0 6,14 * * *'  # 8am and 4pm Europe/Helsinki (UTC+2 in winter, UTC+3 in summer)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache camoufox browser
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: backend/camoufox_build
          key: camoufox-jwriter20-v152.0.4-beta.28-v1

      - name: Download camoufox browser
        if: steps.cache-camoufox.outputs.cache-hit != 'true'
        run: |
          cd backend
          curl -fL -o camoufox.zip "https://github.com/JWriter20/camoufox/releases/download/v152.0.4-20260729/camoufox-152.0.4-beta.28-lin.x86_64.zip"
          unzip -q camoufox.zip -d camoufox_build
          rm camoufox.zip
          chmod +x camoufox_build/camoufox-bin
          # This release ships NO version.json; setup_camoufox.py synthesises it
          # from application.ini. Assert on what the archive actually contains.
          test -x camoufox_build/camoufox-bin || { echo "no camoufox-bin in archive"; exit 1; }
          test -f camoufox_build/application.ini || { echo "no application.ini in archive"; exit 1; }
          grep '^Version=' camoufox_build/application.ini

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64 libdbus-glib-1-2 libxt6

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Register camoufox build with the camoufox library
        run: python backend/setup_camoufox.py

      - name: Mask proxy components
        if: env.UPSTREAM_PROXY != ''
        run: |
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*@\(.*\):.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*:\([0-9]*\)$|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://\(.*\):.*@.*|\1|p')"
          echo "::add-mask::$(echo "$UPSTREAM_PROXY" | sed -n 's|.*://.*:\(.*\)@.*|\1|p')"
        env:
          UPSTREAM_PROXY: ${{ secrets.UPSTREAM_PROXY }}

      # continue-on-error so a bad scrape still publishes whatever it did collect;
      # the health gate at the end of the job turns the run red.
      - name: Run scraper
        id: scrape
        continue-on-error: true
        working-directory: backend/src
        run: python scraper.py
        timeout-minutes: 20
        env:
          SCRAPER_HTTP_PROXY: ${{ secrets.UPSTREAM_PROXY }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ public/
          git diff --staged --quiet || git commit -m "Update tennis news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Health gate
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Scraper reported unhealthy sources - see data/health.json below"
          cat data/health.json || echo "(no health.json written)"
          exit 1

  deploy:
    needs: scrape
    # A failed health gate still leaves a valid (if incomplete) artifact, so keep
    # publishing rather than letting the site go stale on top of a red run.
    if: always() && needs.scrape.result != 'cancelled' && needs.scrape.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
